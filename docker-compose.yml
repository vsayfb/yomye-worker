services:
  categorization-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: cat-worker
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env

  categorization-benchmark:
    profiles:
      - benchmark
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    env_file:
      - .env
    environment:
      RUN_AI_BENCHMARK: "1"

networks:
  default:
    external: true
    name: gig-platform
